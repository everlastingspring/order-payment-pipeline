name: CI Workflow

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

env:
  AWS_REGION: ap-south-1
  JAVA_VERSION: '21'

# ── BUILD + TEST ───────────────────────────────────────────────────────
jobs:
  build:
    name: Build, Test (unit + IT) & Upload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Clean Install
        # -T 1C uses parallel CPU cores. 1 thread per core running all modules in parallel
        # 'install' makes common-lib available to other modules.
        run: mvn clean install -B -T 1C

      - name: Upload Artifacts (JARs + Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            **/target/*.jar
            **/target/site/jacoco/
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 1

# ── COVERAGE + SONARCLOUD ────────────────────────────────────────────
  quality:
    name: Coverage Gate + SonarCloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for Sonar blame annotations

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: JaCoCo check + SonarCloud analysis
        # We skip tests because we already have the reports in the target folder.
        # Sonar will automatically find the Jacoco XMLs.
        # compile so the /target/classes are visible
        run: mvn compile sonar:sonar -B -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ── OWASP SECURITY SCAN ──────────────────────────────────────────────
  security:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Current ISO week
        id: date
        run: echo "week=$(date +'%Y-W%V')" >> $GITHUB_OUTPUT

      - name: Cache NVD database
        id: nvd-cache
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dependency-check  # matches dataDirectory in pom.xml
          key: owasp-nvd-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        # cache-hit → skip NVD update, data already fresh this week
        # cache-miss → pull latest CVEs from NVD (once per week)
        # enableMemorySegments=false → silences Lucene vector incubator warning on Java 21
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn dependency-check:aggregate --batch-mode -DskipTests \
            -DnvdApiKey="$NVD_API_KEY" \
            -Dorg.apache.lucene.store.MMapDirectory.enableMemorySegments=false \
            ${{ steps.nvd-cache.outputs.cache-hit == 'true' && '-DautoUpdate=false' || '' }}
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 14

# ── DOCKER BUILD + TRIVY + ECR PUSH ───────────────────────────────────
  docker:
    name: Docker → ECR (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: |
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            port: 8080
          - service: order-service
            port: 8081
          - service: payment-service
            port: 8082
          - service: inventory-service
            port: 8083
          - service: notification-service
            port: 8084
          - service: wallet-service
            port: 8085

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download JARs  # download the jars from build stage
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          REF_SLUG=${GITHUB_REF_NAME//\//-}  # feature/foo → feature-foo
          REPO=${{ steps.ecr-login.outputs.registry }}/order-payment-platform/${{ matrix.service }}
          echo "sha=$REPO:$SHA_SHORT"  >> $GITHUB_OUTPUT
          echo "ref=$REPO:$REF_SLUG"   >> $GITHUB_OUTPUT
          echo "latest=$REPO:latest"   >> $GITHUB_OUTPUT

      - name: Prepare Docker Context
        run: |
          mkdir -p ${{ matrix.service }}/target
          cp **/target/${{ matrix.service }}-*.jar ${{ matrix.service }}/target/

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.tags.outputs.sha }} \
            -t ${{ steps.tags.outputs.ref }} \
            -t ${{ steps.tags.outputs.latest }} \
            ${{ matrix.service }}/

      - name: Scan image with Trivy  # warn only; set exit-code 1 to block on CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: |
          docker push ${{ steps.tags.outputs.sha }}
          docker push ${{ steps.tags.outputs.ref }}
          docker push ${{ steps.tags.outputs.latest }}

      - name: Summary
        run: |
          echo "### Docker image pushed ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | URI |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| sha | \`${{ steps.tags.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | \`${{ steps.tags.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ steps.tags.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
