name: CI Workflow

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

env:
  AWS_REGION: ap-south-1
  JAVA_VERSION: '21'

# ── BUILD + TEST ───────────────────────────────────────────────────────
jobs:
  build:
    name: Build, Test (unit + IT) & Upload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Clean Install
        # -T 1C uses parallel CPU cores. 1 thread per core running all modules in parallel
        # 'install' makes common-lib available to other modules.
        run: mvn clean install -B -T 1C

      - name: Upload Artifacts (JARs + Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            **/target/*.jar
            **/target/classes/
            **/target/site/jacoco/
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 1

# ── COVERAGE + SONARCLOUD ────────────────────────────────────────────
  quality:
    name: Coverage Gate + SonarCloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for Sonar blame annotations

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: JaCoCo check + SonarCloud analysis
        # We skip tests because we already have the reports in the target folder.
        # Sonar will automatically find the Jacoco XMLs.
        run: mvn sonar:sonar -B -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ── OWASP SECURITY SCAN (FAST PATH) ──────────────────────────────────
  security:
    name: OWASP Dependency-Check (warm cache only)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Current UTC day
        id: date
        run: echo "day=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.owasp-dependency-check  # matches dataDirectory in pom.xml
          key: owasp-nvd-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Fail fast when deploy path has no fresh NVD cache
        if: |
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
          steps.nvd-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::No fresh same-day OWASP NVD cache was available for this deploy-path run."
          echo "::error::Run the scheduled 'Security Refresh' workflow, or trigger it manually, before re-running this pipeline."
          exit 1

      - name: Skip cold-start sync on non-deploy paths
        if: |
          github.ref != 'refs/heads/master' &&
          !startsWith(github.ref, 'refs/tags/v') &&
          steps.nvd-cache.outputs.cache-hit == ''
        run: |
          echo "### OWASP scan skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- No warmed NVD cache was available." >> "$GITHUB_STEP_SUMMARY"
          echo "- CI stayed on the fast path instead of triggering a cold NVD download." >> "$GITHUB_STEP_SUMMARY"
          echo "- Use the scheduled or manual 'Security Refresh' workflow to repopulate the cache." >> "$GITHUB_STEP_SUMMARY"

      - name: Warn when using a stale restored NVD cache
        if: |
          github.ref != 'refs/heads/master' &&
          !startsWith(github.ref, 'refs/tags/v') &&
          steps.nvd-cache.outputs.cache-hit == 'false'
        run: |
          echo "### OWASP cache status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency-Check used the latest restored cache, but it was not an exact same-day match." >> "$GITHUB_STEP_SUMMARY"
          echo "- The fast path stayed warm and avoided a live NVD refresh during CI." >> "$GITHUB_STEP_SUMMARY"

      - name: Run warm-cache OWASP Dependency-Check
        if: steps.nvd-cache.outputs.cache-hit != ''
        run: |
          mvn dependency-check:aggregate --batch-mode -DskipTests \
            -DautoUpdate=false \
            -Dorg.apache.lucene.store.MMapDirectory.enableMemorySegments=false \
            -DsuppressionFiles=".owasp-suppressions.xml"

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 14
          if-no-files-found: ignore

# ── DOCKER BUILD + TRIVY + ECR PUSH ───────────────────────────────────
  docker:
    name: Docker → ECR (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: |
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            port: 8080
          - service: order-service
            port: 8081
          - service: payment-service
            port: 8082
          - service: inventory-service
            port: 8083
          - service: notification-service
            port: 8084
          - service: wallet-service
            port: 8085

    steps:
      - uses: actions/checkout@v4

      - name: Download JARs  # download the jars from build stage
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          REF_SLUG=${GITHUB_REF_NAME//\//-}  # feature/foo → feature-foo
          REPO=${{ steps.ecr-login.outputs.registry }}/order-payment-platform/${{ matrix.service }}
          echo "sha=$REPO:$SHA_SHORT"  >> $GITHUB_OUTPUT
          echo "ref=$REPO:$REF_SLUG"   >> $GITHUB_OUTPUT
          echo "latest=$REPO:latest"   >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.tags.outputs.sha }} \
            -t ${{ steps.tags.outputs.ref }} \
            -t ${{ steps.tags.outputs.latest }} \
            ${{ matrix.service }}/

      - name: Scan image with Trivy  # warn only; set exit-code 1 to block on CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: |
          docker push ${{ steps.tags.outputs.sha }}
          docker push ${{ steps.tags.outputs.ref }}
          docker push ${{ steps.tags.outputs.latest }}

      - name: Summary
        run: |
          echo "### Docker image pushed ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | URI |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| sha | \`${{ steps.tags.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | \`${{ steps.tags.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ steps.tags.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
