name: Security Refresh

on:
  schedule:
    - cron: '12 0 * * *'
    - cron: '17 1 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

permissions:
  contents: read

concurrency:
  group: security-refresh
  cancel-in-progress: false

jobs:
  dependency-check-refresh:
    name: Refresh OWASP cache + full report
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is required for the Security Refresh workflow."
            exit 1
          fi

      - name: Current UTC day
        id: date
        run: echo "day=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore prior NVD cache
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.owasp-dependency-check
          key: owasp-nvd-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run full OWASP Dependency-Check refresh
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn dependency-check:aggregate --batch-mode -DskipTests \
            -DnvdApiKey="$NVD_API_KEY" \
            -Dorg.apache.lucene.store.MMapDirectory.enableMemorySegments=false \
            -DsuppressionFiles=".owasp-suppressions.xml"

      - name: Save refreshed NVD cache
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.owasp-dependency-check
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Upload OWASP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_id }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        run: |
          echo "### Security refresh complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache key: \`owasp-nvd-${{ runner.os }}-${{ steps.date.outputs.day }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache restore status: \`${{ steps.nvd-cache.outputs.cache-hit }}\` (empty means cold miss)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Full Dependency-Check report artifacts were uploaded for this run." >> "$GITHUB_STEP_SUMMARY"
