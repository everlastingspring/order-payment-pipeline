apiVersion: v1
kind: ServiceAccount
metadata:
  name: nemoclaw-sre-sa
  namespace: payment-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nemoclaw-sre-role
  namespace: payment-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemoclaw-sre-rb
  namespace: payment-platform
subjects:
  - kind: ServiceAccount
    name: nemoclaw-sre-sa
    namespace: payment-platform
roleRef:
  kind: Role
  name: nemoclaw-sre-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemoclaw-sre-agent
  namespace: payment-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nemoclaw-sre-agent
  template:
    metadata:
      labels:
        app: nemoclaw-sre-agent
    spec:
      serviceAccountName: nemoclaw-sre-sa
      containers:
        - name: nemoclaw
          image: nvidia/nemoclaw:latest
          env:
            - name: AGENT_ROLE
              value: "SRE_MONITOR"
            - name: TARGET_NAMESPACE
              value: "payment-platform"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: MEMPALACE_CONFIG_PATH
              value: "/etc/nemoclaw/mempalace.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/nemoclaw
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: nemoclaw-config
