wing: order_payment_pipeline
policies:
  - name: OOM_PREVENTION
    description: Increase memory limit if service is consistently above 85% usage
    condition: "container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85"
    action: "patch_deployment_memory(increment=32Mi, max_limit=384Mi)"
  - name: LATENCY_SAFEGUARD
    description: Stop load test or alert if api-gateway p95 latency > 500ms
    condition: "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job='api-gateway'}[1m])) by (le)) > 0.5"
    action: "alert_user('Critical latency spike detected in API Gateway')"
